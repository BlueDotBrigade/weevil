name: Main branch
description: Compiles and runs unit tests for Weevil's main branch using .NET 10.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Both jobs only check out, build and test.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Test data such as 10MillionRecords_UTF8.zip is stored in Git LFS, and DatenLokator unzips it when the tests start (#1127).
      # The cache downloads each LFS file once, not on every build, because downloads count against the LFS bandwidth.
      - name: List Git LFS files
        shell: bash
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Restore Git LFS files
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch Git LFS files
        run: git lfs pull

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Weevil-v2.sln

      # Some automated tests rely on InternalsVisibleTo to access internal implementation types.
      # InternalsVisibleTo is intentionally restricted to DEBUG builds to avoid widening
      # the public surface area in Release, so CI must use the Debug configuration.
      - name: Build (Debug, x64)
        run: dotnet build Weevil-v2.sln --configuration Debug -p:Platform=x64 --no-restore

      # The benchmarks take minutes and need a Release build, so CI leaves them out. The Benchmarks workflow runs them on demand (#1177).
      - name: Test (Debug, x64)
        run: dotnet test Weevil-v2.sln --configuration Debug -p:Platform=x64 --no-build --verbosity normal --filter "TestCategory!=Benchmark"

      # Runs the Core and CLI tests again with every log opened on disk, unless a test chooses a mode (#1025, #1027).
      # Only these projects: a Debug GUI follows the same setting, and the performance tests measure RAM mode.
      # The functional tests save sidecars beside their logs, so their test data is restored first, for both runs to use the same.
      - name: Test on disk (Debug, x64)
        shell: bash
        run: |
          git checkout -- Tst/BlueDotBrigade.Weevil.Core-FunctionalTests/.Daten
          for project in Core-UnitTests Core-FeatureTests Core-FunctionalTests Cli-FunctionalTests; do
            dotnet test "Tst/BlueDotBrigade.Weevil.$project/BlueDotBrigade.Weevil.$project.csproj" --configuration Debug -p:Platform=x64 --no-build --settings Tst/Disk.runsettings --verbosity normal
          done

  # Everything except the WPF GUI and its tests must also build and pass on Linux (#973).
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Test data such as 10MillionRecords_UTF8.zip is stored in Git LFS, and DatenLokator unzips it when the tests start (#1127).
      # The cache downloads each LFS file once, not on every build, because downloads count against the LFS bandwidth.
      - name: List Git LFS files
        shell: bash
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Restore Git LFS files
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch Git LFS files
        run: git lfs pull

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The benchmarks take minutes and need a Release build, so CI leaves them out. The Benchmarks workflow runs them on demand (#1177).
      - name: Test (Debug, x64)
        run: |
          for project in Tst/*/*.csproj; do
            if [[ "$project" == *Gui* ]]; then continue; fi
            dotnet test "$project" --configuration Debug -p:Platform=x64 --verbosity normal --filter "TestCategory!=Benchmark"
          done

      # Runs the Core and CLI tests again with every log opened on disk, unless a test chooses a mode (#1025, #1027).
      # Only these projects: a Debug GUI follows the same setting, and the performance tests measure RAM mode.
      # The functional tests save sidecars beside their logs, so their test data is restored first, for both runs to use the same.
      - name: Test on disk (Debug, x64)
        shell: bash
        run: |
          git checkout -- Tst/BlueDotBrigade.Weevil.Core-FunctionalTests/.Daten
          for project in Core-UnitTests Core-FeatureTests Core-FunctionalTests Cli-FunctionalTests; do
            dotnet test "Tst/BlueDotBrigade.Weevil.$project/BlueDotBrigade.Weevil.$project.csproj" --configuration Debug -p:Platform=x64 --no-build --settings Tst/Disk.runsettings --verbosity normal
          done

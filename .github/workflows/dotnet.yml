name: Main branch
description: Compiles and runs unit tests for Weevil's main branch using .NET 10.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Both jobs only check out, build and test.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Test data such as 10MillionRecords.zip is stored in Git LFS, and DatenLokator unzips it when the tests start (#1127).
      # The cache downloads each LFS file once, not on every build, because downloads count against the LFS bandwidth.
      - name: List Git LFS files
        shell: bash
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Restore Git LFS files
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch Git LFS files
        run: git lfs pull

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Weevil-v2.sln

      # Some automated tests rely on InternalsVisibleTo to access internal implementation types.
      # InternalsVisibleTo is intentionally restricted to DEBUG builds to avoid widening
      # the public surface area in Release, so CI must use the Debug configuration.
      - name: Build (Debug, x64)
        run: dotnet build Weevil-v2.sln --configuration Debug -p:Platform=x64 --no-restore

      - name: Test (Debug, x64)
        run: dotnet test Weevil-v2.sln --configuration Debug -p:Platform=x64 --no-build --verbosity normal

  # Everything except the WPF GUI and its tests must also build and pass on Linux (#973).
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Test data such as 10MillionRecords.zip is stored in Git LFS, and DatenLokator unzips it when the tests start (#1127).
      # The cache downloads each LFS file once, not on every build, because downloads count against the LFS bandwidth.
      - name: List Git LFS files
        shell: bash
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Restore Git LFS files
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch Git LFS files
        run: git lfs pull

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test (Debug, x64)
        run: |
          for project in Tst/*/*.csproj; do
            if [[ "$project" == *Gui* ]]; then continue; fi
            dotnet test "$project" --configuration Debug -p:Platform=x64 --verbosity normal
          done

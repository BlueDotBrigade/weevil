name: SonarQube

on:
  push:
    branches:
      - main
      - 'Releases/3.x'
  workflow_dispatch:

permissions:
  contents: read

# Avoid wasting runner time when a newer commit replaces an older analysis.
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    # Static analysis is advisory and must not fail the CI workflow.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Reuse the existing CI approach for large test fixtures tracked by Git LFS.
      - name: List Git LFS files
        shell: bash
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Restore Git LFS files
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch Git LFS files
        run: git lfs pull

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: zulu

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~\\sonar\\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarScanner for .NET
        shell: pwsh
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install Microsoft dotnet-coverage
        shell: pwsh
        run: dotnet tool install --global dotnet-coverage

      - name: Analyze Weevil (Debug, x64)
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet sonarscanner begin /k:"BlueDotBrigade_weevil" /o:"bluedotbrigade" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.qualitygate.wait=false /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml
          if ($LASTEXITCODE -ne 0) { throw "SonarScanner begin failed" }

          dotnet restore Weevil-v2.sln -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "Restore failed" }

          dotnet build Weevil-v2.sln --configuration Debug -p:Platform=x64 --no-restore --no-incremental
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

          # Produce a single Visual Studio-compatible XML report for SonarQube.
          # Benchmarks are intentionally excluded, matching the main CI workflow.
          dotnet-coverage collect 'dotnet test Weevil-v2.sln --configuration Debug -p:Platform=x64 --no-build --verbosity normal --filter "TestCategory!=Benchmark"' -f xml -o coverage.xml
          if ($LASTEXITCODE -ne 0) { throw "Tests or coverage collection failed" }
          if (-not (Test-Path coverage.xml)) { throw "Coverage report was not produced" }

          dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { throw "SonarScanner end failed" }
